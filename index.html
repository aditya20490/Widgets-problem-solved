<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Study Timer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ---------- TIMER ---------- */

    #overlay {
        text-align: center;
        padding: 20px;
        user-select: none;
    }

    #title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 8px;
        text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    #schedule {
        font-size: 16px;
        opacity: .85;
        margin-bottom: 20px;
        text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    #timer {
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: 3px;
        text-shadow: 0 3px 12px rgba(0,0,0,.9);
    }

    #mode {
        margin-top: 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    #session {
        margin-top: 8px;
        font-size: 15px;
        opacity: .8;
        text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    #elapsed {
        margin-top: 15px;
        font-size: 16px;
        opacity: .85;
        text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }

    /* ---------- SETTINGS ---------- */

    #settingsButton {
        position: fixed;
        top: 15px;
        right: 15px;
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: rgba(0,0,0,.65);
        color: white;
        font-size: 21px;
        cursor: pointer;
    }

    #settings {
        display: none;
        position: fixed;
        top: 65px;
        right: 15px;
        width: 300px;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px;
        background: rgba(20,20,20,.96);
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0,0,0,.6);
    }

    #settings.open {
        display: block;
    }

    h2 {
        margin-top: 0;
    }

    label {
        display: block;
        margin-top: 13px;
        margin-bottom: 5px;
        font-size: 13px;
        opacity: .85;
    }

    input, select {
        width: 100%;
        padding: 9px;
        border-radius: 7px;
        border: 1px solid #555;
        background: #222;
        color: white;
    }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 18px;
    }

    button.action {
        padding: 10px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 700;
    }

    #startBtn {
        background: #35c759;
        color: white;
    }

    #pauseBtn {
        background: #ff9f0a;
        color: white;
    }

    #resetBtn {
        background: #ff453a;
        color: white;
    }

    #saveBtn {
        background: #0a84ff;
        color: white;
    }
</style>
</head>

<body>

<div id="overlay">

    <div id="title">JEE STUDY WITH ME</div>

    <div id="schedule">
        06:30 AM — 12:30 PM
    </div>

    <div id="timer">25:00</div>

    <div id="mode">STUDY</div>

    <div id="session">
        SESSION 1
    </div>

    <div id="elapsed">
        STUDY TIME: 00:00:00
    </div>

</div>


<button id="settingsButton">⚙</button>


<div id="settings">

    <h2>Timer Settings</h2>

    <label>Title</label>
    <input id="titleInput" value="JEE STUDY WITH ME">

    <label>Schedule</label>
    <input id="scheduleInput" value="06:30 AM — 12:30 PM">

    <label>Study minutes</label>
    <input id="studyInput" type="number" min="1" value="25">

    <label>Break minutes</label>
    <input id="breakInput" type="number" min="1" value="5">

    <label>Mode</label>
    <select id="modeInput">
        <option value="manual">Manual</option>
        <option value="pomodoro">Automatic Pomodoro</option>
    </select>

    <label>Timer font size</label>
    <input id="fontInput" type="number" min="20" max="200" value="76">

    <label>Timer color</label>
    <input id="colorInput" type="color" value="#ffffff">

    <div class="buttons">
        <button class="action" id="startBtn">START</button>
        <button class="action" id="pauseBtn">PAUSE</button>
        <button class="action" id="resetBtn">RESET</button>
        <button class="action" id="saveBtn">SAVE</button>
    </div>

</div>


<script>

let studyMinutes = 25;
let breakMinutes = 5;

let remainingSeconds = studyMinutes * 60;

let mode = "STUDY";
let session = 1;

let running = false;
let interval = null;

let elapsedStudySeconds = 0;


/* ---------- ELEMENTS ---------- */

const timer = document.getElementById("timer");
const modeText = document.getElementById("mode");
const sessionText = document.getElementById("session");
const elapsedText = document.getElementById("elapsed");

const title = document.getElementById("title");
const schedule = document.getElementById("schedule");


/* ---------- FORMAT TIME ---------- */

function formatTime(seconds) {

    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;

    if (h > 0) {
        return String(h).padStart(2,"0") + ":" +
               String(m).padStart(2,"0") + ":" +
               String(s).padStart(2,"0");
    }

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");
}


/* ---------- UPDATE DISPLAY ---------- */

function updateDisplay() {

    timer.textContent = formatTime(remainingSeconds);

    modeText.textContent = mode;

    sessionText.textContent = "SESSION " + session;

    elapsedText.textContent =
        "STUDY TIME: " + formatTime(elapsedStudySeconds);

}


/* ---------- TIMER LOOP ---------- */

function tick() {

    if (!running) return;

    remainingSeconds--;

    if (mode === "STUDY") {
        elapsedStudySeconds++;
    }

    if (remainingSeconds <= 0) {

        if (mode === "STUDY") {

            mode = "BREAK";
            remainingSeconds = breakMinutes * 60;

        } else {

            mode = "STUDY";
            session++;
            remainingSeconds = studyMinutes * 60;

        }

    }

    updateDisplay();
}


/* ---------- START ---------- */

document.getElementById("startBtn").onclick = function() {

    if (running) return;

    running = true;

    interval = setInterval(tick, 1000);

};


/* ---------- PAUSE ---------- */

document.getElementById("pauseBtn").onclick = function() {

    running = false;

    clearInterval(interval);

};


/* ---------- RESET ---------- */

document.getElementById("resetBtn").onclick = function() {

    running = false;

    clearInterval(interval);

    studyMinutes =
        parseInt(document.getElementById("studyInput").value) || 25;

    breakMinutes =
        parseInt(document.getElementById("breakInput").value) || 5;

    mode = "STUDY";
    session = 1;

    remainingSeconds = studyMinutes * 60;

    elapsedStudySeconds = 0;

    updateDisplay();

};


/* ---------- SETTINGS ---------- */

document.getElementById("settingsButton").onclick = function() {

    document.getElementById("settings").classList.toggle("open");

};


/* ---------- SAVE SETTINGS ---------- */

document.getElementById("saveBtn").onclick = function() {

    studyMinutes =
        parseInt(document.getElementById("studyInput").value) || 25;

    breakMinutes =
        parseInt(document.getElementById("breakInput").value) || 5;

    title.textContent =
        document.getElementById("titleInput").value;

    schedule.textContent =
        document.getElementById("scheduleInput").value;

    timer.style.fontSize =
        document.getElementById("fontInput").value + "px";

    timer.style.color =
        document.getElementById("colorInput").value;

    if (!running) {
        remainingSeconds = studyMinutes * 60;
        mode = "STUDY";
        session = 1;
    }

    localStorage.setItem("studyMinutes", studyMinutes);
    localStorage.setItem("breakMinutes", breakMinutes);
    localStorage.setItem("title", title.textContent);
    localStorage.setItem("schedule", schedule.textContent);
    localStorage.setItem("fontSize", timer.style.fontSize);
    localStorage.setItem("color", timer.style.color);

    updateDisplay();

};


/* ---------- LOAD SAVED SETTINGS ---------- */

window.onload = function() {

    const savedStudy =
        localStorage.getItem("studyMinutes");

    const savedBreak =
        localStorage.getItem("breakMinutes");

    const savedTitle =
        localStorage.getItem("title");

    const savedSchedule =
        localStorage.getItem("schedule");

    const savedFont =
        localStorage.getItem("fontSize");

    const savedColor =
        localStorage.getItem("color");


    if (savedStudy) {

        studyMinutes = parseInt(savedStudy);

        document.getElementById("studyInput").value =
            savedStudy;

    }

    if (savedBreak) {

        breakMinutes = parseInt(savedBreak);

        document.getElementById("breakInput").value =
            savedBreak;

    }

    if (savedTitle) {

        title.textContent = savedTitle;

        document.getElementById("titleInput").value =
            savedTitle;

    }

    if (savedSchedule) {

        schedule.textContent = savedSchedule;

        document.getElementById("scheduleInput").value =
            savedSchedule;

    }

    if (savedFont) {

        timer.style.fontSize = savedFont;

        document.getElementById("fontInput").value =
            parseInt(savedFont);

    }

    if (savedColor) {

        timer.style.color = savedColor;

        document.getElementById("colorInput").value =
            savedColor;

    }

    remainingSeconds = studyMinutes * 60;

    updateDisplay();

};

</script>

</body>
                        </html>
