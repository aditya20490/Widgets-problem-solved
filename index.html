<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Stream Widget Builder</title>

<style>
*{box-sizing:border-box}

:root{
  color-scheme:dark;
}

body{
  margin:0;
  background:#090b10;
  color:#f5f7fb;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:1px solid #303846;
  background:#1a202b;
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
}

button:hover{
  background:#222a37;
}

button.primary{
  background:#fff;
  color:#090b10;
  border-color:#fff;
  font-weight:700;
}

button.danger{
  border-color:#71363d;
  color:#ffb8bf;
}

button.small{
  padding:7px 9px;
  font-size:13px;
}

.app{
  max-width:1180px;
  margin:auto;
  padding:22px;
}

h1{
  margin:0 0 6px;
  font-size:28px;
}

.sub{
  color:#9da5b4;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:18px;
}

.card{
  background:#11151d;
  border:1px solid #242a35;
  border-radius:18px;
  padding:16px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.card h2{
  font-size:17px;
  margin:0 0 12px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row>*{
  min-width:0;
}

.stack{
  display:grid;
  gap:10px;
}

.field{
  display:grid;
  gap:5px;
}

label{
  font-size:12px;
  color:#aeb6c5;
}

input,select{
  width:100%;
  background:#0c1016;
  color:#fff;
  border:1px solid #303846;
  border-radius:9px;
  padding:9px;
}

input[type="range"]{
  padding:0;
  accent-color:#fff;
}

input[type="color"]{
  height:40px;
  padding:4px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.three{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.widget-list{
  display:grid;
  gap:8px;
  margin-bottom:12px;
}

.widget-item{
  padding:10px;
  border:1px solid #2b323f;
  border-radius:11px;
  background:#0d1117;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.widget-item.active{
  border-color:#fff;
}

.widget-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.muted{
  color:#8992a2;
  font-size:12px;
}

.editor{
  min-height:360px;
}

.preview-wrap{
  margin-top:16px;
  border:1px solid #242a35;
  border-radius:18px;
  overflow:hidden;
  background:#05070b;
}

.preview-title{
  padding:10px 14px;
  color:#9da5b4;
  font-size:12px;
  border-bottom:1px solid #242a35;
}

.preview{
  position:relative;
  height:420px;
  overflow:hidden;
  background:
    linear-gradient(135deg,#151a23,#090c12);
}

.stage-widget{
  position:absolute;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  line-height:1;
  text-rendering:geometricPrecision;
}

.preview .stage-widget{
  pointer-events:none;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.notice{
  padding:10px 12px;
  border-radius:10px;
  background:#0d131c;
  border:1px solid #263142;
  color:#b9c2d0;
  font-size:12px;
}

.checks{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.check{
  display:flex;
  align-items:center;
  gap:6px;
  color:#c8cfda;
  font-size:12px;
}

.check input{
  width:auto;
}

.empty{
  color:#707887;
  text-align:center;
  padding:25px;
}

.overlay-body{
  margin:0;
  background:transparent;
  overflow:hidden;
}

.overlay-stage{
  position:fixed;
  inset:0;
  background:transparent;
  overflow:hidden;
}

.overlay-widget{
  position:absolute;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  line-height:1;
  text-rendering:geometricPrecision;
}

/* =========================================================
   BLUR WIDGET
   ========================================================= */

.blur-widget{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;

  /*
    backdrop-filter is what makes the area underneath
    the PRISM browser overlay become blurred.
  */

  backdrop-filter:blur(var(--blur-amount));
  -webkit-backdrop-filter:blur(var(--blur-amount));

  background:rgba(255,255,255,var(--blur-opacity));

  overflow:hidden;
}

/*
  The soft boundary is created using a mask.
  The center remains fully blurred while the edges
  gradually become transparent.
*/

.blur-widget.soft{
  -webkit-mask-image:radial-gradient(
    ellipse at center,
    #000 55%,
    rgba(0,0,0,.85) 68%,
    rgba(0,0,0,.5) 82%,
    transparent 100%
  );

  mask-image:radial-gradient(
    ellipse at center,
    #000 55%,
    rgba(0,0,0,.85) 68%,
    rgba(0,0,0,.5) 82%,
    transparent 100%
  );
}

.blur-widget.soft-extra{
  -webkit-mask-image:radial-gradient(
    ellipse at center,
    #000 35%,
    rgba(0,0,0,.9) 52%,
    rgba(0,0,0,.6) 68%,
    rgba(0,0,0,.25) 84%,
    transparent 100%
  );

  mask-image:radial-gradient(
    ellipse at center,
    #000 35%,
    rgba(0,0,0,.9) 52%,
    rgba(0,0,0,.6) 68%,
    rgba(0,0,0,.25) 84%,
    transparent 100%
  );
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr;
  }

  .preview{
    height:360px;
  }
}
</style>
</head>

<body>

<div id="builder" class="app">

  <h1>Study Stream Widget Builder</h1>

  <div class="sub">
    Create timers, countdowns, text and blur overlays for PRISM Live Studio.
  </div>

  <div class="grid">

    <section class="card">

      <h2>Widgets</h2>

      <div class="toolbar" style="margin-bottom:12px">

        <button onclick="addWidget('timer')">
          + Timer
        </button>

        <button onclick="addWidget('countdown')">
          + Countdown
        </button>

        <button onclick="addWidget('text')">
          + Text
        </button>

        <button onclick="addWidget('blur')">
          + Blur
        </button>

      </div>

      <div id="widgetList" class="widget-list"></div>

      <div class="notice">
        Start a timer before pressing <b>Copy PRISM URL</b>.
        The running state and exact start time are saved in the URL.
      </div>

    </section>


    <section class="card editor">

      <h2>Edit selected widget</h2>

      <div id="editor"></div>

    </section>

  </div>


  <div class="card" style="margin-top:18px">

    <h2>Preview</h2>

    <div id="preview" class="preview"></div>

    <div class="toolbar" style="margin-top:12px">

      <button class="primary" onclick="applyChanges()">
        Apply Changes
      </button>

      <button onclick="copyPrismURL()">
        Copy PRISM URL
      </button>

      <button class="danger" onclick="clearAll()">
        Clear All
      </button>

    </div>

    <div id="status" class="muted" style="margin-top:10px"></div>

  </div>

</div>


<div id="overlay" class="overlay-stage" style="display:none"></div>


<script>

/* =========================================================
   BASIC DATA
   ========================================================= */

const STORAGE_KEY =
  "study-stream-widget-builder-v4";

let widgets = [];
let selectedId = null;


/* =========================================================
   CREATE WIDGET
   ========================================================= */

function uid(){

  return Math.random().toString(36).slice(2,10)
       + Date.now().toString(36);

}


function defaultWidget(type){

  /* TEXT */

  if(type === "text"){

    return {
      id:uid(),
      type:"text",
      name:"Text",
      text:"JEE STUDY WITH ME",
      font:"Inter",
      size:48,
      color:"#ffffff",
      x:50,
      y:50
    };

  }


  /* BLUR */

  if(type === "blur"){

    return {

      id:uid(),

      type:"blur",

      name:"Blur",

      /*
        Shape:
        rectangle
        square
        circle
        oval
      */

      shape:"rectangle",

      x:50,
      y:50,

      width:25,
      height:20,

      /*
        Blur strength in pixels.
      */

      blur:18,

      /*
        Boundary:
        hard
        soft
        extra-soft
      */

      boundary:"hard",

      /*
        Very subtle transparent white layer.
        This helps establish the backdrop-filter area.
      */

      opacity:0.03,

      borderRadius:0

    };

  }


  /* COUNTDOWN */

  if(type === "countdown"){

    return {

      id:uid(),

      type:"timer",

      name:"Countdown",

      mode:"countdown",

      hours:0,
      minutes:30,
      seconds:0,

      showHours:true,
      showMinutes:true,
      showSeconds:true,

      font:"Impact",
      size:64,
      color:"#ffffff",

      x:50,
      y:50,

      running:false,

      startedAt:null,

      pausedRemaining:1800

    };

  }


  /* TIMER */

  return {

    id:uid(),

    type:"timer",

    name:"Timer",

    mode:"countup",

    hours:0,
    minutes:0,
    seconds:0,

    showHours:true,
    showMinutes:true,
    showSeconds:true,

    font:"Impact",
    size:64,
    color:"#ffffff",

    x:50,
    y:50,

    running:false,

    startedAt:null,

    pausedElapsed:0

  };

}


function addWidget(type){

  const w =
    defaultWidget(type);

  widgets.push(w);

  selectedId =
    w.id;

  renderAll();

}


/* =========================================================
   GET SELECTED
   ========================================================= */

function getSelected(){

  return widgets.find(
    w => w.id === selectedId
  );

}


/* =========================================================
   TIME FUNCTIONS
   ========================================================= */

function durationSeconds(w){

  return (Number(w.hours) || 0) * 3600
       + (Number(w.minutes) || 0) * 60
       + (Number(w.seconds) || 0);

}


function currentSeconds(
  w,
  now = Date.now()
){

  if(w.type !== "timer"){
    return 0;
  }


  /* COUNTDOWN */

  if(w.mode === "countdown"){

    const total =
      durationSeconds(w);


    if(
      w.running &&
      Number.isFinite(
        Number(w.startedAt)
      )
    ){

      const elapsed =
        Math.floor(
          (now - Number(w.startedAt)) / 1000
        );

      return Math.max(
        0,
        total - elapsed
      );

    }


    if(
      Number.isFinite(
        Number(w.pausedRemaining)
      )
    ){

      return Math.max(
        0,
        Number(w.pausedRemaining)
      );

    }


    return total;

  }


  /* COUNT UP */

  if(
    w.running &&
    Number.isFinite(
      Number(w.startedAt)
    )
  ){

    const elapsed =
      Math.floor(
        (now - Number(w.startedAt)) / 1000
      );

    return Math.max(
      0,
      Number(w.pausedElapsed || 0) + elapsed
    );

  }


  return Math.max(
    0,
    Number(w.pausedElapsed || 0)
  );

}


/* =========================================================
   FORMAT TIMER
   ========================================================= */

function formatTime(
  totalSeconds,
  w
){

  totalSeconds =
    Math.max(
      0,
      Math.floor(totalSeconds)
    );


  const h =
    Math.floor(
      totalSeconds / 3600
    );


  const m =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const s =
    totalSeconds % 60;


  const parts = [];


  if(w.showHours){

    parts.push(
      String(h).padStart(2,"0")
    );

  }


  if(w.showMinutes){

    parts.push(
      String(m).padStart(2,"0")
    );

  }


  if(w.showSeconds){

    parts.push(
      String(s).padStart(2,"0")
    );

  }


  return parts.length
    ? parts.join(":")
    : "00";

}


/* =========================================================
   START TIMER
   ========================================================= */

function startTimer(id){

  const w =
    widgets.find(
      x => x.id === id
    );


  if(
    !w ||
    w.type !== "timer"
  ){
    return;
  }


  const now =
    Date.now();


  if(w.mode === "countdown"){

    let remaining;


    if(
      Number.isFinite(
        Number(w.pausedRemaining)
      )
    ){

      remaining =
        Number(w.pausedRemaining);

    }

    else{

      remaining =
        durationSeconds(w);

    }


    if(remaining <= 0){

      remaining =
        durationSeconds(w);

    }


    w.pausedRemaining =
      remaining;

    w.startedAt =
      now;

    w.running =
      true;

  }


  else{

    w.startedAt =
      now;

    w.running =
      true;

  }


  renderAll();

}


/* =========================================================
   PAUSE TIMER
   ========================================================= */

function pauseTimer(id){

  const w =
    widgets.find(
      x => x.id === id
    );


  if(
    !w ||
    w.type !== "timer" ||
    !w.running
  ){
    return;
  }


  if(w.mode === "countdown"){

    w.pausedRemaining =
      currentSeconds(w);

  }

  else{

    w.pausedElapsed =
      currentSeconds(w);

  }


  w.running =
    false;

  w.startedAt =
    null;

  renderAll();

}


/* =========================================================
   RESET TIMER
   ========================================================= */

function resetTimer(id){

  const w =
    widgets.find(
      x => x.id === id
    );


  if(
    !w ||
    w.type !== "timer"
  ){
    return;
  }


  w.running =
    false;

  w.startedAt =
    null;


  if(w.mode === "countdown"){

    w.pausedRemaining =
      durationSeconds(w);

  }

  else{

    w.pausedElapsed =
      0;

  }


  renderAll();

}


/* =========================================================
   REMOVE / DUPLICATE
   ========================================================= */

function removeWidget(id){

  widgets =
    widgets.filter(
      w => w.id !== id
    );


  if(selectedId === id){

    selectedId =
      widgets[0]?.id || null;

  }


  renderAll();

}


function duplicateWidget(id){

  const original =
    widgets.find(
      w => w.id === id
    );


  if(!original){
    return;
  }


  const copy =
    JSON.parse(
      JSON.stringify(original)
    );


  copy.id =
    uid();

  copy.name =
    original.name + " Copy";


  if(copy.type === "timer"){

    copy.running =
      false;

    copy.startedAt =
      null;


    if(copy.mode === "countdown"){

      copy.pausedRemaining =
        durationSeconds(copy);

    }

    else{

      copy.pausedElapsed =
        0;

    }

  }


  widgets.push(copy);

  selectedId =
    copy.id;

  renderAll();

}


/* =========================================================
   EDIT FIELDS
   ========================================================= */

function setField(
  field,
  value
){

  const w =
    getSelected();


  if(!w){
    return;
  }


  if([
    "size",
    "x",
    "y",
    "hours",
    "minutes",
    "seconds",
    "width",
    "height",
    "blur",
    "opacity",
    "borderRadius"
  ].includes(field)){

    value =
      Number(value);

  }


  if([
    "showHours",
    "showMinutes",
    "showSeconds"
  ].includes(field)){

    value =
      !!value;

  }


  w[field] =
    value;


  if(
    w.type === "timer" &&
    w.mode === "countdown" &&
    [
      "hours",
      "minutes",
      "seconds"
    ].includes(field) &&
    !w.running
  ){

    w.pausedRemaining =
      durationSeconds(w);

  }


  saveLocal();

  renderList();

  renderEditor();

  renderPreview();

}


/* =========================================================
   WIDGET LIST
   ========================================================= */

function renderList(){

  const el =
    document.getElementById(
      "widgetList"
    );


  if(!widgets.length){

    el.innerHTML =
      '<div class="empty">No widgets yet.</div>';

    return;

  }


  el.innerHTML =
    widgets.map(w => `

      <div class="widget-item ${
        w.id === selectedId
          ? "active"
          : ""
      }">

        <button
          class="small"
          style="
            flex:1;
            text-align:left;
            background:transparent;
            border:0
          "
          onclick="
            selectedId='${w.id}';
            renderAll();
          "
        >

          <div class="widget-name">

            <b>
              ${escapeHtml(w.name)}
            </b>

          </div>

          <div class="muted">

            ${
              w.type === "text"

              ? "Text"

              : w.type === "blur"

              ? "Blur"

              : (
                  w.mode === "countdown"
                  ? "Countdown"
                  : "Timer"
                )
            }

          </div>

        </button>


        <button
          class="small"
          onclick="
            duplicateWidget('${w.id}')
          "
        >
          ⧉
        </button>


        <button
          class="small danger"
          onclick="
            removeWidget('${w.id}')
          "
        >
          ×
        </button>

      </div>

    `).join("");

}


/* =========================================================
   EDITOR
   ========================================================= */

function renderEditor(){

  const el =
    document.getElementById(
      "editor"
    );


  const w =
    getSelected();


  if(!w){

    el.innerHTML =
      '<div class="empty">Select a widget to edit it.</div>';

    return;

  }


  /* =======================================================
     TEXT
     ======================================================= */

  if(w.type === "text"){

    el.innerHTML = `

      <div class="stack">

        <div class="field">

          <label>Name</label>

          <input
            value="${escapeAttr(w.name)}"
            oninput="
              setField(
                'name',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>Text</label>

          <input
            value="${escapeAttr(w.text)}"
            oninput="
              setField(
                'text',
                this.value
              )
            "
          >

        </div>


        ${styleFields(w)}

      </div>

    `;

    return;

  }


  /* =======================================================
     BLUR
     ======================================================= */

  if(w.type === "blur"){

    el.innerHTML = `

      <div class="stack">

        <div class="field">

          <label>Name</label>

          <input
            value="${escapeAttr(w.name)}"
            oninput="
              setField(
                'name',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>Shape</label>

          <select
            onchange="
              setField(
                'shape',
                this.value
              )
            "
          >

            <option
              value="rectangle"
              ${w.shape === "rectangle" ? "selected" : ""}
            >
              Rectangle
            </option>

            <option
              value="square"
              ${w.shape === "square" ? "selected" : ""}
            >
              Square
            </option>

            <option
              value="circle"
              ${w.shape === "circle" ? "selected" : ""}
            >
              Circle
            </option>

            <option
              value="oval"
              ${w.shape === "oval" ? "selected" : ""}
            >
              Oval
            </option>

          </select>

        </div>


        <div class="two">

          <div class="field">

            <label>X position (%)</label>

            <input
              type="number"
              min="0"
              max="100"
              step="0.1"
              value="${w.x}"
              onchange="
                setField(
                  'x',
                  this.value
                )
              "
            >

          </div>


          <div class="field">

            <label>Y position (%)</label>

            <input
              type="number"
              min="0"
              max="100"
              step="0.1"
              value="${w.y}"
              onchange="
                setField(
                  'y',
                  this.value
                )
              "
            >

          </div>

        </div>


        <div class="two">

          <div class="field">

            <label>Width (%)</label>

            <input
              type="number"
              min="1"
              max="100"
              step="0.1"
              value="${w.width}"
              onchange="
                setField(
                  'width',
                  this.value
                )
              "
            >

          </div>


          <div class="field">

            <label>Height (%)</label>

            <input
              type="number"
              min="1"
              max="100"
              step="0.1"
              value="${w.height}"
              onchange="
                setField(
                  'height',
                  this.value
                )
              "
            >

          </div>

        </div>


        <div class="field">

          <label>
            Blur strength:
            <b id="blurValue">
              ${w.blur}px
            </b>
          </label>

          <input
            type="range"
            min="0"
            max="100"
            step="1"
            value="${w.blur}"
            oninput="
              setField(
                'blur',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>Boundary</label>

          <select
            onchange="
              setField(
                'boundary',
                this.value
              )
            "
          >

            <option
              value="hard"
              ${w.boundary === "hard" ? "selected" : ""}
            >
              Hard
            </option>

            <option
              value="soft"
              ${w.boundary === "soft" ? "selected" : ""}
            >
              Soft
            </option>

            <option
              value="extra-soft"
              ${w.boundary === "extra-soft" ? "selected" : ""}
            >
              Extra Soft
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Blur opacity:
            <b>
              ${Math.round(
                Number(w.opacity || 0) * 100
              )}%
            </b>
          </label>

          <input
            type="range"
            min="0"
            max="0.3"
            step="0.01"
            value="${w.opacity}"
            oninput="
              setField(
                'opacity',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>
            Border radius:
            <b>
              ${w.borderRadius}px
            </b>
          </label>

          <input
            type="range"
            min="0"
            max="100"
            step="1"
            value="${w.borderRadius}"
            oninput="
              setField(
                'borderRadius',
                this.value
              )
            "
          >

        </div>


        <div class="notice">

          The blur only affects the area underneath
          this widget. Move and resize it until it
          covers the part of your camera view you
          want blurred.

        </div>

      </div>

    `;

    return;

  }


  /* =======================================================
     TIMER / COUNTDOWN
     ======================================================= */

  const isDown =
    w.mode === "countdown";


  const running =
    w.running;


  el.innerHTML = `

    <div class="stack">

      <div class="field">

        <label>Name</label>

        <input
          value="${escapeAttr(w.name)}"
          oninput="
            setField(
              'name',
              this.value
            )
          "
        >

      </div>


      <div class="field">

        <label>Mode</label>

        <select
          onchange="
            changeTimerMode(
              this.value
            )
          "
        >

          <option
            value="countup"
            ${!isDown ? "selected" : ""}
          >
            Count Up
          </option>


          <option
            value="countdown"
            ${isDown ? "selected" : ""}
          >
            Countdown
          </option>

        </select>

      </div>


      <div class="three">

        <div class="field">

          <label>Hours</label>

          <input
            type="number"
            min="0"
            value="${w.hours}"
            onchange="
              setField(
                'hours',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>Minutes</label>

          <input
            type="number"
            min="0"
            value="${w.minutes}"
            onchange="
              setField(
                'minutes',
                this.value
              )
            "
          >

        </div>


        <div class="field">

          <label>Seconds</label>

          <input
            type="number"
            min="0"
            value="${w.seconds}"
            onchange="
              setField(
                'seconds',
                this.value
              )
            "
          >

        </div>

      </div>


      <div class="checks">

        <label class="check">

          <input
            type="checkbox"
            ${w.showHours ? "checked" : ""}
            onchange="
              setField(
                'showHours',
                this.checked
              )
            "
          >

          Hours

        </label>


        <label class="check">

          <input
            type="checkbox"
            ${w.showMinutes ? "checked" : ""}
            onchange="
              setField(
                'showMinutes',
                this.checked
              )
            "
          >

          Minutes

        </label>


        <label class="check">

          <input
            type="checkbox"
            ${w.showSeconds ? "checked" : ""}
            onchange="
              setField(
                'showSeconds',
                this.checked
              )
            "
          >

          Seconds

        </label>

      </div>


      <div class="toolbar">

        ${
          running

          ? `
            <button
              onclick="
                pauseTimer('${w.id}')
              "
            >
              Pause
            </button>
          `

          : `
            <button
              class="primary"
              onclick="
                startTimer('${w.id}')
              "
            >
              Start
            </button>
          `
        }


        <button
          onclick="
            resetTimer('${w.id}')
          "
        >
          Reset
        </button>

      </div>


      <div class="notice">

        Current:

        <b id="editorTimerValue">

          ${formatTime(
            currentSeconds(w),
            w
          )}

        </b>

        ${
          running
          ? " • running"
          : " • paused"
        }

      </div>


      ${styleFields(w)}

    </div>

  `;

}


/* =========================================================
   STYLE FIELDS
   ========================================================= */

      <div class="field">

        <label>Font</label>

        <select

          "

          ${
            [

              "Arial",
              "Georgia",
              "Impact",

              "monospace",
              "sans-serif"

                <option
                  ${w.font === f ? "selected" : ""}
                >
                  ${f}
                </option>
              `
            ).join("")
          }

        </select>

      </div>


      <div class="field">

        <label>Size</label>

        <input
          type="number"

          max="300"
          value="${w.size}"
          onchange="

              'size',
              this.value
            )
          "
        >

      </div>

    </div>


    <div class="two">

      <div class="field">

        <label>Color</label>

        <input
          type="color"
          value="${w.color}"
          onchange="
            setField(
              'color',
              this.value
            )
          "
        >

      </div>

      <div></div>

    </div>


    <div class="two">

      <div class="field">

        <label>X position (%)</label>

        <input

            )

      <div class="field">

        <label>Y position (%)</label>

        <input
          type="number"
          min="0"

            )

/* =========================================================
   CHANGE TIMER MODE
   ========================================================= */

function changeTimerMode(mode){

  const w =
    getSelected();


  if(
    !w ||
    w.type !== "timer"
  ){
    return;
  }


  w.running =
    false;

  w.startedAt =
    null;

  w.mode =
    mode;


  if(mode === "countdown"){

    w.pausedRemaining =
      durationSeconds(w);

    delete w.pausedElapsed;

  }

  else{

    w.pausedElapsed =
      0;

    delete w.pausedRemaining;

  }


  saveLocal();

  renderAll();

}


/* =========================================================
   BLUR STYLE
   ========================================================= */

function blurStyle(w){

  let width =
    Number(w.width) || 25;

  let height =
    Number(w.height) || 20;


  /*
    Square means equal dimensions.

    We use the smaller dimension so the shape
    remains genuinely square.
  */

  if(w.shape === "square"){

    const size =
      Math.min(
        width,
        height
      );

    width =
      size;

    height =
      size;

  }


  if(w.shape === "circle"){

    const size =
      Math.min(
        width,
        height
      );

    width =
      size;

    height =
      size;

  }


  let radius =
    Number(w.borderRadius) || 0;


  if(w.shape === "circle"){

    radius =
      50;

  }

  else if(w.shape === "oval"){

    radius =
      50;

  }


  return {

    width,
    height,
    radius

  };

}


/* =========================================================
   BLUR PREVIEW
   ========================================================= */

function renderBlurPreview(w){

  const shape =
    blurStyle(w);


  let boundaryClass =
    "";


  if(w.boundary === "soft"){

    boundaryClass =
      " soft";

  }

  else if(
    w.boundary === "extra-soft"
  ){

    boundaryClass =
      " soft-extra";

  }


  return `

    <div
      class="blur-widget${boundaryClass}"
      style="
        left:${Number(w.x) || 50}%;
        top:${Number(w.y) || 50}%;

        width:${shape.width}%;

        height:${shape.height}%;

        border-radius:${shape.radius}%;

        --blur-amount:${Number(w.blur) || 0}px;

        --blur-opacity:${Number(
          w.opacity
        ) || 0};
      "
    ></div>

  `;

}


/* =========================================================
   PREVIEW
   ========================================================= */

function renderPreview(){

  const el =
    document.getElementById(
      "preview"
    );


  if(!widgets.length){

    el.innerHTML =
      '<div class="empty">Preview is empty.</div>';

    return;

  }


  el.innerHTML =
    widgets.map(w => {

      /* BLUR */

      if(w.type === "blur"){

        return renderBlurPreview(w);

      }


      let content = "";


      if(w.type === "text"){

        content =
          w.text || "";

      }

      else{

        content =
          formatTime(
            currentSeconds(w),
            w
          );

      }


      return `

        <div
          class="stage-widget"
          style="
            left:${w.x}%;
            top:${w.y}%;
            font-family:${escapeAttr(w.font)};
            font-size:${w.size}px;
            color:${escapeAttr(w.color)}
          "
        >

          ${escapeHtml(content)}

        </div>

      `;

    }).join("");

}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function renderAll(){

  renderList();

  renderEditor();

  renderPreview();

  saveLocal();

}


/* =========================================================
   APPLY
   ========================================================= */

function applyChanges(){

  saveLocal();

  renderAll();

  setStatus(
    "Changes applied."
  );

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){

  document.getElementById(
    "status"
  ).textContent =
    text;

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll(){

  if(
    !confirm(
      "Clear all widgets?"
    )
  ){
    return;
  }


  widgets = [];

  selectedId =
    null;

  localStorage.removeItem(
    STORAGE_KEY
  );

  renderAll();

  setStatus(
    "All widgets cleared."
  );

}


/* =========================================================
   URL CONFIGURATION
   ========================================================= */

function buildConfig(){

  return {

    version:4,

    widgets:

      widgets.map(w => {

        const copy =
          JSON.parse(
            JSON.stringify(w)
          );


        if(
          copy.type === "timer"
        ){

          if(copy.running){

            copy.startedAt =
              Number(
                copy.startedAt
              );


            if(
              copy.mode === "countdown"
            ){

              copy.pausedRemaining =
                Number(
                  copy.pausedRemaining ??
                  durationSeconds(copy)
                );

            }

            else{

              copy.pausedElapsed =
                Number(
                  copy.pausedElapsed || 0
                );

            }

          }

          else{

            copy.startedAt =
              null;

          }

        }


        return copy;

      })

  };

}


/* =========================================================
   ENCODE CONFIG
   ========================================================= */

function encodeConfig(config){

  const json =
    JSON.stringify(config);


  const bytes =
    new TextEncoder().encode(
      json
    );


  let binary =
    "";

  const chunk =
    0x8000;


  for(
    let i = 0;
    i < bytes.length;
    i += chunk
  ){

    binary += String.fromCharCode(
      ...bytes.subarray(
        i,
        i + chunk
      )
    );

  }


  return btoa(binary);

}


/* =========================================================
   DECODE CONFIG
   ========================================================= */

function decodeConfig(encoded){

  try{

    const binary =
      atob(encoded);


    const bytes =
      Uint8Array.from(
        binary,
        c => c.charCodeAt(0)
      );


    return JSON.parse(
      new TextDecoder().decode(
        bytes
      )
    );

  }

  catch(e){

    return null;

  }

}


/* =========================================================
   COPY PRISM URL
   ========================================================= */

async function copyPrismURL(){

  const config =
    buildConfig();


  const encoded =
    encodeConfig(
      config
    );


  const url =
    location.origin +
    location.pathname +
    "?overlay=1#config=" +
    encodeURIComponent(
      encoded
    );


  try{

    await navigator.clipboard.writeText(
      url
    );


    setStatus(
      "PRISM URL copied. Open the copied URL in Chrome to test it."
    );

  }

  catch(e){

    prompt(
      "Copy this PRISM URL:",
      url
    );

  }

}


/* =========================================================
   OVERLAY MODE
   ========================================================= */

function initOverlay(){

  document.getElementById(
    "builder"
  ).style.display =
    "none";


  document.body.className =
    "overlay-body";


  const encoded =
    location.hash.startsWith(
      "#config="
    )

    ? decodeURIComponent(
        location.hash.slice(8)
      )

    : "";


  const config =
    decodeConfig(
      encoded
    );


  if(
    !config ||
    !Array.isArray(
      config.widgets
    )
  ){

    document.getElementById(
      "overlay"
    ).innerHTML =
      "";

    return;

  }


  const overlay =
    document.getElementById(
      "overlay"
    );


  overlay.style.display =
    "block";


  const list =
    config.widgets;


  /* =======================================================
     DRAW OVERLAY
     ======================================================= */

  function draw(){

    const now =
      Date.now();


    overlay.innerHTML =
      list.map(w => {

        /* BLUR */

        if(w.type === "blur"){

          const shape =
            blurStyle(w);


          let boundaryClass =
            "";


          if(
            w.boundary === "soft"
          ){

            boundaryClass =
              " soft";

          }

          else if(
            w.boundary === "extra-soft"
          ){

            boundaryClass =
              " soft-extra";

          }


          return `

            <div
              class="
                blur-widget
                ${boundaryClass}
              "
              style="
                left:${Number(w.x) || 0}%;

                top:${Number(w.y) || 0}%;

                width:${shape.width}%;

                height:${shape.height}%;

                border-radius:${shape.radius}%;

                --blur-amount:${Number(
                  w.blur
                ) || 0}px;

                --blur-opacity:${Number(
                  w.opacity
                ) || 0};
              "
            ></div>

          `;

        }


        /* TEXT / TIMER */

        let content =
          "";


        if(w.type === "text"){

          content =
            w.text || "";

        }

        else{

          content =
            formatOverlayTimer(
              w,
              now
            );

        }


        return `

          <div
            class="overlay-widget"
            style="
              left:${Number(w.x) || 0}%;
              top:${Number(w.y) || 0}%;

              font-family:${escapeAttr(
                w.font || "Inter"
              )};

              font-size:${Number(
                w.size || 48
              )}px;

              color:${escapeAttr(
                w.color || "#fff"
              )}
            "
          >

            ${escapeHtml(content)}

          </div>

        `;

      }).join("");

  }


  draw();


  setInterval(
    draw,
    250
  );

}


/* =========================================================
   OVERLAY TIMER ENGINE
   ========================================================= */

function formatOverlayTimer(
  w,
  now
){

  let total;


  /* COUNTDOWN */

  if(
    w.mode === "countdown"
  ){

    const duration =
      (Number(w.hours) || 0) * 3600 +
      (Number(w.minutes) || 0) * 60 +
      (Number(w.seconds) || 0);


    if(
      w.running &&
      Number.isFinite(
        Number(w.startedAt)
      )
    ){

      const elapsed =
        Math.floor(
          (
            now -
            Number(w.startedAt)
          ) / 1000
        );


      total =
        Math.max(
          0,
          duration - elapsed
        );

    }

    else if(
      Number.isFinite(
        Number(w.pausedRemaining)
      )
    ){

      total =
        Math.max(
          0,
          Number(w.pausedRemaining)
        );

    }

    else{

      total =
        duration;

    }

  }


  /* COUNT UP */

  else{

    const paused =
      Number(
        w.pausedElapsed
      ) || 0;


    if(
      w.running &&
      Number.isFinite(
        Number(w.startedAt)
      )
    ){

      const elapsed =
        Math.floor(
          (
            now -
            Number(w.startedAt)
          ) / 1000
        );


      total =
        Math.max(
          0,
          paused + elapsed
        );

    }

    else{

      total =
        Math.max(
          0,
          paused
        );

    }

  }


  return formatTime(
    total,
    w
  );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(
    value
  );

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function saveLocal(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        widgets
      )
    );

  }

  catch(e){}

}


function loadLocal(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(raw){

      const parsed =
        JSON.parse(raw);


      if(
        Array.isArray(parsed)
      ){

        widgets =
          parsed;

      }

    }

  }

  catch(e){}

}


/* =========================================================
   STARTUP
   ========================================================= */

if(
  location.search.includes(
    "overlay=1"
  )
){

  initOverlay();

}

else{

  loadLocal();


  if(!widgets.length){

    const first =
      defaultWidget(
        "timer"
      );


    widgets.push(
      first
    );


    selectedId =
      first.id;

  }

  else{

    selectedId =
      widgets[0].id;

  }


  /*
    Repair old saved timer widgets.
  */

  widgets.forEach(w => {

    if(
      w.type === "timer" &&
      w.mode === "countdown" &&
      !w.running &&
      !Number.isFinite(
        Number(w.pausedRemaining)
      )
    ){

      w.pausedRemaining =
        durationSeconds(w);

    }


    if(
      w.type === "timer" &&
      w.mode === "countup" &&
      !w.running &&
      !Number.isFinite(
        Number(w.pausedElapsed)
      )
    ){

      w.pausedElapsed =
        0;

    }


    /*
      Repair blur widgets created by future/older
      versions if any fields are missing.
    */

    if(w.type === "blur"){

      if(!w.shape){
        w.shape = "rectangle";
      }

      if(!Number.isFinite(Number(w.x))){
        w.x = 50;
      }

      if(!Number.isFinite(Number(w.y))){
        w.y = 50;
      }

      if(!Number.isFinite(Number(w.width))){
        w.width = 25;
      }

      if(!Number.isFinite(Number(w.height))){
        w.height = 20;
      }

      if(!Number.isFinite(Number(w.blur))){
        w.blur = 18;
      }

      if(!w.boundary){
        w.boundary = "hard";
      }

      if(!Number.isFinite(Number(w.opacity))){
        w.opacity = 0.03;
      }

      if(!Number.isFinite(Number(w.borderRadius))){
        w.borderRadius = 0;
      }

    }

  });


  renderAll();


  setInterval(
    () => {

      renderPreview();


      const w =
        getSelected();


      const valueEl =
        document.getElementById(
          "editorTimerValue"
        );


      if(
        w &&
        w.type === "timer" &&
        valueEl
      ){

        valueEl.textContent =
          formatTime(
            currentSeconds(w),
            w
          );


        if(
          w.running &&
          w.mode === "countdown" &&
          currentSeconds(w) <= 0
        ){

          w.running =
            false;

          w.startedAt =
            null;

          w.pausedRemaining =
            0;

          renderAll();

        }

      }

    },

    250

  );

}
